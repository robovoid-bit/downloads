<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 ChromeOS Critical Warning 🚨</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #202124;
            color: #f1f3f4;
            font-family: 'Roboto', sans-serif, Arial;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Continuous in-and-out full screen zoom effect */
        .scare-container {
            border: 3px solid #f28b82;
            padding: 40px;
            background: #2d2f31;
            text-align: center;
            border-radius: 8px;
            max-width: 500px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            animation: pulseZoom 0.25s infinite alternate ease-in-out;
        }

        @keyframes pulseZoom {
            0% { transform: scale(0.85); }
            100% { transform: scale(1.15); }
        }

        h1 { font-size: 2rem; color: #f28b82; margin: 0 0 15px 0; }
        p { font-size: 1.1rem; color: #e8eaed; line-height: 1.5; }
        
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>

    <div class="scare-container">
        <h1>⚠️ OS Exception 0x3F9 ⚠️</h1>
        <p>Unverified background processes have breached sandbox isolation protocols.</p>
        <p>Click below immediately to patch the kernel and restore account sync parameters.</p>
        <button class="btn" id="start-btn">⚠️ FIX DEVICE NOW</button>
    </div>

    <script>
        const btn = document.getElementById('start-btn');

        const phrases = [
            "Syncing local files to server...",
            "Warning: Device operating at maximum meme capacity.",
            "Formatting system architecture...",
            "Downloading illegal pizza recipes...",
            "Error: Task failed successfully.",
            "Your wallpaper has been replaced by a potato."
        ];

        // This function handles the loops smoothly without crashing the system
        function runChaosLoop() {
            // 1. Fire actual native OS desktop push notifications
            if ("Notification" in window && Notification.permission === "granted") {
                setInterval(() => {
                    const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                    new Notification("🚨 SYSTEM ALERT", {
                        body: randomPhrase,
                        icon: "https://google.com"
                    });
                }, 400); // Sends a desktop alert card down the side every 400ms
            }

            // 2. Fire continuous popups that loop cleanly without hanging the UI
            setInterval(() => {
                alert("🚨 ChromeOS Alert: Click OK to continue doing absolutely nothing.");
            }, 50); 
        }

        // The trigger event attached directly to the user gesture
        btn.addEventListener('click', () => {
            // Ask Chrome for permission to slide actual notifications into the OS panel
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    // Start everything the instant they select an option or drop into the loop
                    runChaosLoop();
                });
            } else {
                runChaosLoop();
            }
        });
    </script>
</body>
</html>
